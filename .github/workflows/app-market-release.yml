name: Build and release firmware for ESP App Market

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version used for validation (no release is published)
        required: true
        default: v0.0.0-local

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          python -m pip install platformio

      - name: Build firmware
        run: |
          pio run -e esp32-color-kit -e esp32-color-kit-pro
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" .pio/build/esp32-color-kit/boot_app0.bin
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" .pio/build/esp32-color-kit-pro/boot_app0.bin

      - name: Prepare and validate App Market assets
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: node scripts/app-market-release.mjs

      - name: Upload GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: .app-market/release/*
          fail_on_unmatched_files: true
