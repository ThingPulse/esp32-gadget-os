name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: native
            os: ubuntu-latest
          - env: esp32-color-kit
            os: ubuntu-latest
          - env: esp32-color-kit-pro
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (native only)
        if: matrix.env == 'native'
        run: sudo apt-get install -y libsdl2-dev

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pioarduino Core
        run: python -m pip install -r requirements-build.txt

      - name: Build ${{ matrix.env }}
        run: platformio run -e ${{ matrix.env }}

      - name: Test device check-in policy
        if: matrix.env == 'native'
        run: python scripts/test-device-management.py

      - name: Test aircraft radar and provider parsing
        if: matrix.env == 'native'
        run: |
          python scripts/test-nearby-planes.py
          python scripts/test-planes-providers.py
