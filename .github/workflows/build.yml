name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gadget-companion:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix tools/gadget-companion
      - run: node tools/gadget-companion/src/cli.mjs --help

  build:
    name: ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: native
            os: ubuntu-latest
          - env: esp32-color-kit
            os: ubuntu-latest
          - env: esp32-color-kit-pro
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (native only)
        if: matrix.env == 'native'
        run: sudo apt-get install -y libsdl2-dev

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'requirements-build.txt') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pioarduino Core
        run: python -m pip install -r requirements-build.txt

      - name: Build ${{ matrix.env }}
        run: platformio run -e ${{ matrix.env }}

      - name: Test shared installable-app UI and settings
        if: matrix.env == 'native'
        run: |
          python scripts/test-native-ui.py
          python scripts/test-native-store-simulator.py
          python scripts/test-iss-installable.py
          python scripts/test-stocks-installable.py
          python scripts/test-phase3-installable.py
          python scripts/test-companion.py

      - name: Test device check-in policy
        if: matrix.env == 'native'
        run: python scripts/test-device-management.py

      - name: Test OTA check schedule
        if: matrix.env == 'native'
        run: python scripts/test-update-schedule.py

      - name: Test stock ticker providers and UI
        if: matrix.env == 'native'
        run: python scripts/test-stocks.py

      - name: Test transit provider and UI
        if: matrix.env == 'native'
        run: python scripts/test-transit.py

      - name: Test language catalogue, fonts and settings
        if: matrix.env == 'native'
        run: |
          python scripts/generate-translations.py
          git diff --exit-code -- src/ui/GermanMessages.inc
          python scripts/test-i18n.py

      - name: Test aircraft radar and provider parsing
        if: matrix.env == 'native'
        run: |
          python scripts/test-nearby-planes.py
          python scripts/test-planes-providers.py

      - name: Test OTA device selection and scheduling
        if: matrix.env == 'native'
        run: |
          python scripts/test-update-target.py
          python scripts/test-update-schedule.py
          node scripts/test-update-manifest.mjs

  native-app-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app toolchain and host crypto
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          python -m pip install -r requirements-build.txt
          # pioarduino provisions its compiler during build configuration;
          # pkg install alone leaves a fresh runner without the executables.
          pio run -e esp32-color-kit -e esp32-color-kit-pro
      - name: Build standalone fixtures
        run: |
          for chip in esp32 esp32s3; do
            for app in counter iss iss_tracker; do
              python experiments/native-app/build.py --chip "$chip" --app "$app" --toolchain "$HOME/.platformio/packages/toolchain-xtensa-esp-elf/bin"
            done
            python experiments/native-app/build.py --chip "$chip" --app agent_usage --toolchain "$HOME/.platformio/packages/toolchain-xtensa-esp-elf/bin"
            python experiments/native-app/build.py --chip "$chip" --app system_monitor --toolchain "$HOME/.platformio/packages/toolchain-xtensa-esp-elf/bin"
          done
      - name: Validate packages, signatures, lifecycle and catalog
        run: |
          python scripts/test-agent-usage.py
          python scripts/test-system-monitor.py
          python scripts/test-iss-package.py
          python scripts/test-native-app.py
          python scripts/test-native-install.py
          python scripts/test-native-signing.py
          python scripts/test-native-catalog.py
          node scripts/test-native-store-page.mjs
          c++ -std=c++17 -g -fsanitize=address,undefined -Iinclude test/native_app/usage.cpp -o /tmp/app-usage-test
          /tmp/app-usage-test
