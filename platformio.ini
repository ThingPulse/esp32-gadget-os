; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native, esp32-color-kit

[env]
;lib_extra_dirs=../../

[env:native]
platform = native
build_type = debug
lib_deps = 
    lovyan03/LovyanGFX@^1.2.19
    lvgl/lvgl@^9.5.0
    bblanchon/ArduinoJson@^7.0.0
build_flags = -O0 -std=c++14 -lSDL2 -DLV_CONF_SKIP -DLV_FONT_MONTSERRAT_24=1
    -D LV_MEM_SIZE=524288U
    -D LV_USE_SYSMON=1
    -D LV_USE_PERF_MONITOR=1
    -fsanitize=address
    -fno-omit-frame-pointer
  -I"/usr/local/include/SDL2"                ; for intel mac homebrew SDL2
  -L"/usr/local/lib"                         ; for intel mac homebrew SDL2
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2" ; for arm mac homebrew SDL2
  -L"${sysenv.HOMEBREW_PREFIX}/lib"          ; for arm mac homebrew SDL2
  -I"C:/msys64/mingw32/include/SDL2"         ; for Windows SDL2
  -L"C:/msys64/mingw32/lib"                  ; for Windows SDL2
build_unflags =
    -Os

[esp32_base]
build_type = debug
platform = espressif32@6.13.0
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17

[env:esp32-color-kit]
extends = esp32_base
framework = arduino
board_build.psram = enabled
lib_deps = 
    lovyan03/LovyanGFX@^1.2.19
    lvgl/lvgl@^9.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/CelliesProjects/OpenStreetMap-esp32.git#1.2.2
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=4
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    -D LV_TICK_CUSTOM=1
    -D LV_DISP_DEF_REFR_PERIOD=10
    -D LV_CONF_SKIP
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_USE_SYSMON=1
    -D LV_USE_PERF_MONITOR=1
    -D TFT_MISO=19
    -D TFT_MOSI=18
    -D TFT_SCLK=5
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TOUCH_SDA=23
    -D TOUCH_SCL=22
    -D TOUCH_INT=27
    -D TOUCH_I2C_ADDR=0x38

[env:esp32-color-kit-pro]
extends = esp32_base
framework = arduino
board = esp32-s3-devkitc-1
board_build.psram = enabled
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_upload.flash_size = 4MB
board_build.partitions = no_ota.csv
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
lib_deps =
    lovyan03/LovyanGFX@^1.2.19
    lvgl/lvgl@^9.5.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/CelliesProjects/OpenStreetMap-esp32.git#1.2.2
build_flags =
    ${esp32_base.build_flags}
    -Isrc/
    -Ihal
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=4
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    -D LV_TICK_CUSTOM=1
    -D LV_DISP_DEF_REFR_PERIOD=10
    -D LV_CONF_SKIP
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_USE_SYSMON=1
    -D LV_USE_PERF_MONITOR=1
    -D AUTO_SLEEP_MILLIS=180000
    -D COLOR_KIT_PRO=1
    -D PIN_TACTILE_BUTTON1=1
    -D PIN_TACTILE_BUTTON3=4
    -D PIN_FUELGAGE_INT=5
    -D PIN_TOUCH_INT=6
    -D PIN_DB0=7
    -D PIN_DB1=15
    -D PIN_DB2=16
    -D PIN_DB3=17
    -D PIN_DB4=18
    -D PIN_DB5=8
    -D PIN_DB6=9
    -D PIN_DB7=10
    -D PIN_DB8=11
    -D PIN_DB9=12
    -D PIN_DB10=13
    -D PIN_DB11=14
    -D PIN_DB12=21
    -D PIN_DB13=47
    -D PIN_DB14=42
    -D PIN_DB15=2
    -D PIN_TFT_RD=48
    -D PIN_TFT_WR=35
    -D PIN_TFT_RS=36
    -D PIN_TFT_CS=37
    -D PIN_TFT_RESET=38
    -D PIN_TFT_LED=39
    -D PIN_I2C_SDA=40
    -D PIN_I2C_SCL=41
    -D PIN_BUZZER=45
