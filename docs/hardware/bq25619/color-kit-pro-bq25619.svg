<text x="665" y="1180" font-size="19">PSEL_BIAS → pin 2</text>
<text x="580" y="1220" font-size="17">HIGH selects 500 mA input limit at reset.</text>
<text x="580" y="1247" font-size="17">Firmware sets limits to match the USB source</text>
<text x="580" y="1274" font-size="17">and the battery; fixed HIGH is not USB negotiation.</text>
<text x="1080" y="1025" font-size="23">Unused pins / integration</text>
<text x="1080" y="1065" font-size="17">3 PMID_GOOD, 4 STAT, 7 /INT, 8 NC: leave open.</text>
<text x="1080" y="1097" font-size="17">12 /QON: leave open (internal pull-up); optional test pad.</text>
<text x="1080" y="1129" font-size="17">Poll charging / USB status over I²C; keep MAX17048.</text>
<text x="1080" y="1161" font-size="17">Remove old TP4065 + D1/D2/Q2 power-path circuit.</text>
<text x="1080" y="1193" font-size="17">Keep USB-C CC resistors, USB data and ESD circuit.</text>
<text x="1080" y="1225" font-size="17">All ground symbols are the same ground plane.</text>
<path class="sym" d="M50 1350 L1750 1350"/>
<text x="50" y="1383" font-size="18">Layout: capacitors close to pins; compact SW loop; exposed pad to ground with thermal vias. Connect every listed duplicate power pin.</text>
<text x="50" y="1413" font-size="17">C_PM2 / C_SYS2: parallel margin for MLCC DC bias; validate effective capacitance. Add a nearby 1 nF PMID HF bypass footprint per TI.</text>
<text x="50" y="1443" font-size="17">Before production: check battery charge limits, capacitor bias curves, USB current policy and PCB layout. This is not a routed / ERC-checked design.</text>
<text x="50" y="1480" font-size="16">Source: TI BQ25618/BQ25619 datasheet Rev. F, pin table and application circuit • https://www.ti.com/lit/gpn/BQ25619</text>
